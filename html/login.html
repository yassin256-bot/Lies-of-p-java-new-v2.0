<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion / Inscription</title>
  <style>
    /* ----------------- Reset & Body ----------------- */
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* ----------------- Background Image ----------------- */
    body {
      background-image: url("https://images4.alphacoders.com/135/1355515.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* ----------------- Overlay Noir Semi-Transparent ----------------- */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.415);
      z-index: 0;
    }

    /* ----------------- Content Box ----------------- */
    .content {
      position: relative;
      z-index: 1; /* au-dessus de l'overlay */
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      color: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
    }

    input {
      font-size: 16px;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    hr {
      border: 1px solid rgba(255,255,255,0.3);
      margin: 20px 0;
    }

    p {
      color: red;
      margin: 5px 0 0 0;
    }

    h2 {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="content">
  <h2>Connexion</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
    <p id="loginError"></p>
  </form>

  <hr>

  <h2>Inscription</h2>
  <form id="registerForm">
    <input type="text" id="registerName" placeholder="Nom" required>
    <input type="email" id="registerEmail" placeholder="Email" required>
    <input type="password" id="registerPassword" placeholder="Mot de passe" required>
    <input type="password" id="registerConfirm" placeholder="Confirmer le mot de passe" required>
    <button type="submit">S'inscrire</button>
    <p id="registerError"></p>
  </form>
</div>

<!-- Inclusion de votre script global si nécessaire -->
<script src="script.js"></script>

<!-- Script d'authentification Supabase (type="module" obligatoire pour l'import) -->
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  // Configuration de Supabase (URLs et clés bien entourées de guillemets)
  const supabaseUrl = 'https://flynusmgbjzodqmqtwww.supabase.co';
  const supabaseKey = 'sb_publishable_hZwGI25ej_tHh7k5pmA2_A_bB9__YpT';
  const supabase = createClient(supabaseUrl, supabaseKey);

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const loginError = document.getElementById("loginError");
  const registerError = document.getElementById("registerError");

  // GESTION DE LA CONNEXION
  loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    loginError.textContent = "";

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    // Connexion officielle via Supabase Auth
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      loginError.textContent = "Erreur : " + error.message;
    } else {
      // Stockage local de secours au cas où index l'utilise
      localStorage.setItem("userName", data.user.email);
      localStorage.setItem("isLoggedIn", "true");
      
      // Redirection
      window.location.href = "iindex.html";
    }
  });

  // GESTION DE L'INSCRIPTION
  registerForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    registerError.textContent = "";

    const name = document.getElementById("registerName").value;
    const email = document.getElementById("registerEmail").value;
    const password = document.getElementById("registerPassword").value;
    const confirmPassword = document.getElementById("registerConfirm").value;

    if (password !== confirmPassword) {
      registerError.textContent = "Les mots de passe ne correspondent pas.";
      return;
    }

    // Inscription officielle via Supabase Auth
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { display_name: name }
      }
    });

    if (error) {
      registerError.textContent = "Erreur : " + error.message;
    } else {
      alert("Inscription réussie ! Vérifiez vos courriels si la confirmation est activée.");
      localStorage.setItem("userName", name);
      localStorage.setItem("isLoggedIn", "true");
      window.location.href = "iindex.html";
    }
  });
</script>
</body>
</html>
